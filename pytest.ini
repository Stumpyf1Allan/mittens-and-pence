[pytest]
testpaths = tests

# The build scripts run pytest with -X warn_default_encoding, so any text read that
# relies on the platform's default encoding is reported. That is the difference between
# the machine the code is written on (UTF-8) and the machine the .exe is built on
# (cp1252), and it has already stopped one build.
#
# openpyxl and ctypes read their own temp files and helper output that way. Neither is
# our code, neither is a problem, and a dependency's habits should not fill somebody's
# build log — so anything that still appears there is ours.
filterwarnings =
    ignore::EncodingWarning:openpyxl.*
    ignore::EncodingWarning:ctypes.*
